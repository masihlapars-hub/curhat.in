<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curhat.in - Ruang Curhat Anonim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        :root {
            --primary: #8A2BE2;
            --secondary: #4A00E0;
            --accent: #FF6B6B;
            --light: #F8F9FA;
            --dark: #212529;
            --gray: #6C757D;
            --success: #28A745;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" opacity="0.1"><path fill="white" d="M30,30 Q50,10 70,30 T90,50 T70,70 T50,90 T30,70 T10,50 T30,30 Z"></path></svg>');
            background-size: 80px;
            opacity: 0.2;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        .tagline {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 20px;
            font-weight: 300;
            position: relative;
        }
        
        .header-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .icon-circle {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s;
        }
        
        .icon-circle:hover {
            transform: translateY(-5px) scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .curhat-form {
            padding: 40px;
            background: white;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        
        .form-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 1.5rem;
        }
        
        .form-title i {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1rem;
            resize: vertical;
            transition: all 0.3s;
            margin-bottom: 15px;
            background: #f9f9f9;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.1);
        }
        
        .char-count {
            text-align: right;
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.3);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.4);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .curhats-container {
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 1.5rem;
        }
        
        .curhat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-left: 5px solid var(--primary);
            position: relative;
            animation: fadeIn 0.5s ease-out;
            transition: all 0.3s;
            overflow: hidden;
        }
        
        .curhat-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
        }
        
        .curhat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .curhat-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--gray);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .user-avatar {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
        }
        
        .curhat-content {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #444;
        }
        
        .curhat-actions {
            display: flex;
            gap: 15px;
        }
        
        .action-btn {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .action-btn:hover {
            color: var(--primary);
            background: #f0f0f0;
        }
        
        .action-btn.liked {
            color: var(--accent);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--gray);
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            color: var(--dark);
        }
        
        /* Animasi karakter lucu */
        .floating-characters {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }
        
        .character {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.8;
            animation: float 6s infinite ease-in-out;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.1));
        }
        
        .char-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .char-2 { top: 20%; right: 10%; animation-delay: 1s; }
        .char-3 { bottom: 30%; left: 15%; animation-delay: 2s; }
        .char-4 { bottom: 15%; right: 5%; animation-delay: 3s; }
        .char-5 { top: 40%; left: 50%; animation-delay: 4s; }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            background: #f8f9fa;
            color: var(--gray);
            font-size: 0.9rem;
            border-top: 1px solid #eee;
        }
        
        /* Animasi */
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
        }
        
        /* Responsif */
        @media (max-width: 768px) {
            .container {
                border-radius: 15px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .tagline {
                font-size: 1.1rem;
            }
            
            .curhat-form, .curhats-container {
                padding: 25px;
            }
            
            .character {
                font-size: 2rem;
            }
            
            .header-icons {
                gap: 15px;
            }
            
            .icon-circle {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .curhat-form, .curhats-container {
                padding: 20px;
            }
            
            .curhat-card {
                padding: 20px;
            }
            
            .curhat-meta {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Karakter animasi lucu -->
        <div class="floating-characters">
            <div class="character char-1">😊</div>
            <div class="character char-2">🤗</div>
            <div class="character char-3">😴</div>
            <div class="character char-4">🤔</div>
            <div class="character char-5">😌</div>
        </div>
        
        <header>
            <h1>Curhat.in</h1>
            <p class="tagline">Ruang aman untuk berbagi cerita tanpa nama</p>
            <div class="header-icons">
                <div class="icon-circle">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="icon-circle">
                    <i class="fas fa-user-secret"></i>
                </div>
                <div class="icon-circle">
                    <i class="fas fa-heart"></i>
                </div>
            </div>
        </header>
        
        <section class="curhat-form">
            <h2 class="form-title"><i class="fas fa-pencil-alt"></i> Tulis Curhatanmu</h2>
            <textarea id="curhatText" placeholder="Tuliskan apa yang ingin kamu curhatkan di sini... (maksimal 500 karakter)" maxlength="500"></textarea>
            <div class="char-count"><span id="charCount">0</span>/500 karakter</div>
            <button id="submitCurhat"><i class="fas fa-paper-plane"></i> Kirim Curhatan</button>
        </section>
        
        <section class="curhats-container">
            <h2 class="section-title"><i class="fas fa-heart"></i> Curhatan Terbaru</h2>
            <div id="curhatsList">
                <!-- Curhatan akan dimuat di sini -->
            </div>
        </section>
        
        <footer>
            <p>Curhat.in &copy; 2023 - Semua curhatan bersifat anonim dan tidak dapat dilacak</p>
            <p><i class="fas fa-shield-alt"></i> Privasi Terjaga | <i class="fas fa-globe"></i> Akses Global</p>
        </footer>
    </div>

    <script>
        // Elemen DOM
        const curhatText = document.getElementById('curhatText');
        const charCount = document.getElementById('charCount');
        const submitBtn = document.getElementById('submitCurhat');
        const curhatsList = document.getElementById('curhatsList');
        
        // Inisialisasi curhatan dari localStorage atau data contoh
        let curhats = JSON.parse(localStorage.getItem('curhats')) || [
            {
                id: 1,
                content: "Hari ini aku merasa sangat lelah dengan semua tekanan kerja. Kadang pengen lari dari semua tanggung jawab ini, tapi harus tetap kuat buat keluarga.",
                timestamp: new Date().getTime() - 3600000,
                likes: 3,
                liked: false
            },
            {
                id: 2,
                content: "Aku rindu sama seseorang yang sudah tidak ada lagi di hidupku. Kenangan itu masih sering terngiang di pikiran, terutama di malam yang sunyi seperti ini.",
                timestamp: new Date().getTime() - 7200000,
                likes: 7,
                liked: false
            },
            {
                id: 3,
                content: "Seneng banget hari ini bisa menyelesaikan project yang sudah ditunda-tunda lama. Akhirnya lega! Terima kasih buat diri sendiri yang sudah berusaha keras.",
                timestamp: new Date().getTime() - 10800000,
                likes: 5,
                liked: false
            },
            {
                id: 4,
                content: "Kadang aku bingung dengan hidup ini. Terlalu banyak pilihan, terlalu banyak ekspektasi. Pengennya hidup sederhana tapi bahagia.",
                timestamp: new Date().getTime() - 14400000,
                likes: 2,
                liked: false
            }
        ];
        
        // Daftar nama anonim acak
        const anonNames = ["Bunga", "Pelangi", "Bintang", "Matahari", "Bulan", "Awan", "Angin", "Hujan", "Petir", "Pelaut", "Pendaki", "Petualang", "Penulis", "Pelukis", "Pemimpi"];
        
        // Generate nama anonim acak
        function getRandomAnonName() {
            return anonNames[Math.floor(Math.random() * anonNames.length)];
        }
        
        // Update karakter count
        curhatText.addEventListener('input', function() {
            charCount.textContent = this.value.length;
        });
        
        // Format waktu relatif
        function formatTime(timestamp) {
            const now = new Date().getTime();
            const diff = now - timestamp;
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return 'Baru saja';
            if (minutes < 60) return `${minutes} menit yang lalu`;
            if (hours < 24) return `${hours} jam yang lalu`;
            return `${days} hari yang lalu`;
        }
        
        // Render curhatan
        function renderCurhats() {
            if (curhats.length === 0) {
                curhatsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment-slash"></i>
                        <h3>Belum ada curhatan</h3>
                        <p>Jadilah yang pertama berbagi cerita</p>
                    </div>
                `;
                return;
            }
            
            // Urutkan berdasarkan waktu (terbaru pertama)
            const sortedCurhats = [...curhats].sort((a, b) => b.timestamp - a.timestamp);
            
            curhatsList.innerHTML = sortedCurhats.map(curhat => `
                <div class="curhat-card" data-id="${curhat.id}">
                    <div class="curhat-meta">
                        <div class="user-info">
                            <div class="user-avatar">${getRandomAnonName().charAt(0)}</div>
                            <span>${getRandomAnonName()}</span>
                        </div>
                        <span><i class="far fa-clock"></i> ${formatTime(curhat.timestamp)}</span>
                    </div>
                    <div class="curhat-content">
                        ${curhat.content}
                    </div>
                    <div class="curhat-actions">
                        <button class="action-btn like-btn ${curhat.liked ? 'liked' : ''}" data-id="${curhat.id}">
                            <i class="${curhat.liked ? 'fas' : 'far'} fa-heart"></i> 
                            <span class="like-count">${curhat.likes}</span>
                        </button>
                        <button class="action-btn">
                            <i class="far fa-bookmark"></i> Simpan
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Tambahkan event listener untuk like button
            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    likeCurhat(id);
                });
            });
        }
        
        // Like curhatan
        function likeCurhat(id) {
            const curhat = curhats.find(c => c.id === id);
            if (curhat) {
                if (curhat.liked) {
                    curhat.likes -= 1;
                    curhat.liked = false;
                } else {
                    curhat.likes += 1;
                    curhat.liked = true;
                }
                
                localStorage.setItem('curhats', JSON.stringify(curhats));
                renderCurhats();
            }
        }
        
        // Submit curhatan baru
        submitBtn.addEventListener('click', function() {
            const content = curhatText.value.trim();
            
            if (content === '') {
                alert('Silakan tulis curhatanmu terlebih dahulu!');
                return;
            }
            
            if (content.length < 10) {
                alert('Curhatan terlalu pendek. Minimal 10 karakter!');
                return;
            }
            
            const newCurhat = {
                id: curhats.length > 0 ? Math.max(...curhats.map(c => c.id)) + 1 : 1,
                content: content,
                timestamp: new Date().getTime(),
                likes: 0,
                liked: false
            };
            
            curhats.push(newCurhat);
            localStorage.setItem('curhats', JSON.stringify(curhats));
            
            // Reset form
            curhatText.value = '';
            charCount.textContent = '0';
            
            // Render ulang
            renderCurhats();
            
            // Scroll ke curhatan baru
            setTimeout(() => {
                const newCurhatElement = document.querySelector(`.curhat-card[data-id="${newCurhat.id}"]`);
                if (newCurhatElement) {
                    newCurhatElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    // Efek highlight
                    newCurhatElement.style.animation = 'pulse 2s';
                    setTimeout(() => {
                        newCurhatElement.style.animation = '';
                    }, 2000);
                }
            }, 100);
            
            // Tampilkan pesan sukses
            showNotification('Curhatanmu telah terkirim! Terima kasih sudah berbagi ❤️');
        });
        
        // Fungsi notifikasi
        function showNotification(message) {
            // Buat elemen notifikasi
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideIn 0.5s, slideOut 0.5s 2.5s forwards;
                max-width: 300px;
            `;
            notification.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            
            // Tambahkan ke body
            document.body.appendChild(notification);
            
            // Hapus setelah 3 detik
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 3000);
        }
        
        // CSS untuk animasi notifikasi
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        
        // Inisialisasi
        renderCurhats();
    </script>
</body>
</html>
