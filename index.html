<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurhatSpace • Global Version</title>
    <style>
        /* Styling untuk website seperti yang kamu inginkan */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        :root {
            --primary: #3b82f6;
            --like: #ef4444;
            --background: #ffffff;
            --card: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body { background: var(--background); color: var(--text); padding: 15px; min-height: 100vh; }

        .container { max-width: 100%; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 25px; }
        .logo { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .tagline { color: var(--text-light); font-size: 1rem; }

        .tabs { display: flex; gap: 10px; background: var(--card); border-radius: 12px; padding: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px 8px; text-align: center; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; font-weight: 500; font-size: 0.9rem; }
        .tab.active { background: var(--primary); color: white; }

        .card { background: var(--card); padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        textarea { width: 100%; min-height: 100px; background: var(--background); border: 2px solid var(--border); border-radius: 12px; padding: 15px; font-size: 16px; color: var(--text); resize: vertical; margin-bottom: 15px; transition: all 0.3s ease; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }

        .curhat-item { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); }
        .curhat-text { font-size: 16px; line-height: 1.5; margin-bottom: 12px; color: var(--text); }
        .curhat-footer { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-light); }

        .like-btn { background: none; border: none; color: var(--text-light); cursor: pointer; padding: 6px 12px; border-radius: 6px; transition: all 0.3s ease; }
        .like-btn:hover { color: var(--like); }

        .theme-toggle { position: fixed; bottom: 15px; right: 15px; background: var(--primary); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; z-index: 100; }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">CurhatSpace</div>
            <div class="tagline">Curhatanmu terlihat oleh semua orang!</div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('tulis')">✏️ Tulis</div>
            <div class="tab" onclick="showTab('feed')">📱 Feed</div>
        </div>

        <!-- Tab Tulis Curhatan -->
        <div id="tulis" class="content active">
            <div class="card">
                <h2>✏️ Tulis Curhatan</h2>
                <textarea id="curhatInput" placeholder="Apa yang ingin kamu ceritakan hari ini? Curhatanmu akan terlihat oleh semua orang..."></textarea>
                <button onclick="tambahCurhat()">Publikasikan ke Global</button>
            </div>
        </div>

        <!-- Tab Feed -->
        <div id="feed" class="content">
            <div class="card">
                <h2>📱 Feed Global</h2>
                <div id="feedContainer">
                    <div class="loading">Memuat curhatan...</div>
                </div>
            </div>
        </div>

    </div>

    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <script>
        let curhats = [];

        function getCurhats() {
            const saved = localStorage.getItem('curhats');
            return saved ? JSON.parse(saved) : [];
        }

        function saveCurhats() {
            localStorage.setItem('curhats', JSON.stringify(curhats));
        }

        function showTab(tabName) {
            document.querySelectorAll('.content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            document.querySelectorAll('.tab').forEach(tab => {
                if (tab.textContent.includes(tabName.charAt(0).toUpperCase())) {
                    tab.classList.add('active');
                }
            });

            if (tabName === 'feed') loadFeed();
        }

        function tambahCurhat() {
            const input = document.getElementById('curhatInput');
            const text = input.value.trim();

            if (!text) {
                alert('Tulis dulu curhatannya!');
                return;
            }

            const newCurhat = {
                id: Date.now(),
                text: text,
                likes: 0,
                timestamp: new Date().toLocaleString()
            };

            curhats.push(newCurhat);
            saveCurhats();
            input.value = '';
            alert('Curhatan berhasil diposting!');

            showTab('feed');
        }

        function loadFeed() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '<div class="loading">Memuat curhatan...</div>';

            setTimeout(() => {
                curhats = getCurhats();
                if (curhats.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 40px 0;">Belum ada curhatan global. Jadilah yang pertama!</div>';
                    return;
                }

                container.innerHTML = '';
                curhats.forEach(curhat => {
                    const div = document.createElement('div');
                    div.className = 'curhat-item';
                    div.innerHTML = `
                        <div class="curhat-text">${curhat.text}</div>
                        <div class="curhat-footer">
                            <span>${curhat.timestamp}</span>
                            <button class="like-btn" onclick="likeCurhat(${curhat.id})">
                                ❤️ ${curhat.likes}
                            </button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }, 500);
        }

        function likeCurhat(id) {
            const curhat = curhats.find(c => c.id === id);
            if (curhat) {
                curhat.likes++;
                saveCurhats();
                loadFeed();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.theme-toggle');
            btn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }

        window.onload = function() {
            curhats = getCurhats();
            loadFeed();
        };
    </script>

</body>
</html>
